name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente a desplegar"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Terraform Init
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_port_client_id: ${{ inputs.environment == 'dev' && secrets.PORT_CLIENT_ID_DEV || secrets.PORT_CLIENT_ID_PROD }}
          TF_VAR_port_client_secret: ${{ inputs.environment == 'dev' && secrets.PORT_CLIENT_SECRET_DEV || secrets.PORT_CLIENT_SECRET_PROD }}
          TF_VAR_port_base_url: ${{ secrets.PORT_BASE_URL }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_port_client_id: ${{ inputs.environment == 'dev' && secrets.PORT_CLIENT_ID_DEV || secrets.PORT_CLIENT_ID_PROD }}
          TF_VAR_port_client_secret: ${{ inputs.environment == 'dev' && secrets.PORT_CLIENT_SECRET_DEV || secrets.PORT_CLIENT_SECRET_PROD }}
          TF_VAR_port_base_url: ${{ secrets.PORT_BASE_URL }}