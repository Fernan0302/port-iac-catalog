name: Port Terraform

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de Port a desplegar"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  terraform:
    name: Terraform - ${{ inputs.environment || 'dev' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Terraform Init
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}

      - name: Terraform Apply
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}